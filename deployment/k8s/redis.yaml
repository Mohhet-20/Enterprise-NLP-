apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nlp-platform
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
          # A real deployment would use a PersistentVolumeClaim here
          # instead of emptyDir — the cache/rate-limit data doesn't need
          # to survive a pod restart (it's an optimization layer, see
          # backend/core/cache.py), but a real Redis-backed session store
          # or job queue would.
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nlp-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
