[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatting, not a hard error

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: downloads and runs real Hugging Face models (slow, needs network)",
]
