# Profiles:
#   dev          -> redis + backend-dev (hot-reload, SQLite, code bind-mounted)
#   prod         -> redis + backend + frontend (built images, no bind mounts)
#   prod-postgres -> add a real Postgres instead of SQLite (opt-in, since
#                    SQLite is genuinely fine at this platform's current scale)
#
# Usage:
#   docker compose --profile dev up
#   docker compose --profile prod --profile prod-postgres up

x-backend-common: &backend-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DATABASE_URL: ${DATABASE_URL:-sqlite:///./nlp_platform.db}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — copy .env.example to .env and fill it in}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:80"]}
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - nlp-platform-network
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nlp-platform-network
    restart: unless-stopped

  # --- dev profile: hot-reload, code bind-mounted, SQLite ---
  backend-dev:
    <<: *backend-common
    profiles: ["dev"]
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # --- prod profile: built image, no bind mounts ---
  # One worker (the image default): each worker would load its own copy of
  # every model. Scale with `--scale backend=N` behind a proxy instead.
  backend:
    <<: *backend-common
    profiles: ["prod"]
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/app/.model_cache
      - ../artifacts/models:/app/artifacts/models:ro

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    profiles: ["prod"]
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - nlp-platform-network
    restart: unless-stopped

  # --- optional: real Postgres instead of the SQLite default ---
  postgres:
    image: postgres:16-alpine
    profiles: ["prod-postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nlp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-nlp_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlp_platform}"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nlp-platform-network
    restart: unless-stopped

networks:
  nlp-platform-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  model_cache:
