server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — any path that isn't a real
    # static file falls back to index.html so deep links like
    # /playground work on a hard refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite outputs content-hashed filenames) are
    # safe to cache aggressively — a new deploy produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
